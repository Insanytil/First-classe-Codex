name: JRPG foundations
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JRPG
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.15'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=JRPG --cov-report=term-missing
      - run: uv build
